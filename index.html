<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E9F6E">
<title>Team Task Workspace</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--p:#0E9F6E;--p7:#0A7350;--p1:#E4F6EE;--ink:#152722;--soft:#4E5F58;--mut:#8B9990;--bd:#E9EEEB;--bg:#F6F8F7;--red:#DF5C46;--red1:#FCEAE6;--amb:#D6A233;--amb1:#FBF2DE;--blue:#4C7CDB;--blue1:#EAF0FC}
*{box-sizing:border-box}
body{margin:0;font:13px/1.5 Poppins,system-ui,sans-serif;background:var(--bg);color:var(--ink);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer}
h1,h2,h3{margin:0;font-weight:600}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 18px;background:#fff;border-bottom:1px solid var(--bd)}
.top h1{font-size:15px}.top small{color:var(--mut);display:block;font-size:11px}
.wrap{max-width:1100px;margin:auto;padding:16px 14px 60px}
.btn{border:1px solid var(--bd);background:#fff;border-radius:9px;padding:7px 13px;font-weight:500;font-size:12px}
.btn:hover{border-color:var(--p);color:var(--p7)}.btn.pri{background:var(--p);border-color:var(--p);color:#fff}.btn.dg{color:var(--red)}
.btn:disabled{opacity:.5}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.st{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left}
.st.on{border-color:var(--p);box-shadow:0 0 0 3px var(--p1)}
.st small{color:var(--mut);display:block}.st b{font-size:22px}
.st.r b{color:var(--red)}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.bar input,.bar select{border:1px solid var(--bd);background:#fff;border-radius:9px;padding:7px 11px;outline:none}
.bar input{flex:1;min-width:160px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 12px;background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px 14px;cursor:pointer}
.row:hover{border-color:var(--p)}
.row b{font-weight:500;font-size:13.5px}.row small{color:var(--mut)}
.meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.bar2{grid-column:1/-1;height:5px;background:var(--bd);border-radius:5px;overflow:hidden}.bar2 i{display:block;height:100%;background:var(--p)}
.tag{padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:600;background:#EEF1EF;color:var(--soft);white-space:nowrap}
.tag.g{background:var(--p1);color:var(--p7)}.tag.r{background:var(--red1);color:var(--red)}.tag.a{background:var(--amb1);color:#96731C}.tag.b{background:var(--blue1);color:var(--blue)}
.late{color:var(--red);font-weight:600}
.empty{text-align:center;color:var(--mut);padding:40px}
.ov{position:fixed;inset:0;background:#0f1c2d73;display:none;z-index:20;overflow-y:auto;padding:30px 12px}.ov.show{display:flex}
.box{background:#fff;border-radius:16px;width:100%;max-width:620px;margin:auto;padding:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.f{display:flex;flex-direction:column;gap:4px}.f.full{grid-column:1/-1}.f label{font-size:11px;font-weight:600;color:var(--soft)}
.f input,.f select,.f textarea{border:1px solid var(--bd);border-radius:9px;padding:8px 10px;outline:none;width:100%;background:#fff}
.f textarea{min-height:80px;resize:vertical}.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--p)}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.cm{border-left:3px solid var(--p);background:var(--bg);border-radius:8px;padding:8px 12px;margin-top:8px}
.cm.m{border-color:var(--blue)}.cm small{color:var(--mut);display:block}
.log{color:var(--mut);font-size:11.5px;margin-top:4px}
h4{margin:16px 0 4px;font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.login{max-width:360px;margin:12vh auto;background:#fff;border:1px solid var(--bd);border-radius:16px;padding:24px}
.login .f{margin:12px 0}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:10px;z-index:50;font-size:12px}
.toast.e{background:var(--red)}
@media(max-width:640px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.f input,.f select,.f textarea,.bar input{font-size:16px}.ov{padding:0;align-items:flex-end}.box{border-radius:18px 18px 0 0}}
</style></head><body>
<div id="app"></div><div class="ov" id="ov"></div>
<script>
/* ====== CONFIG: paste your Apps Script Web App URL (ends with /exec) ====== */
const API_URL = 'https://script.google.com/macros/s/AKfycbyXsB860fDrgahtRD9Yqcqt2_dbSFQ9R71GkqJxFhxg_BkPDm1-5e1TGnqopAmrskPOzg/exec';
/* ========================================================================= */
(()=>{'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>ymd(new Date());
const fd=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—';
const ft=s=>new Date(s).toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
const ST=['Pending','In Progress','On Hold','Completed'],PR=['High','Medium','Low'];
const SC={Pending:'',  'In Progress':'b','On Hold':'a',Completed:'g'},PC={High:'r',Medium:'a',Low:'b'};
let cred=JSON.parse(localStorage.getItem('twCred')||'null'),me=null,users=[],tasks=[],flt='all',q='',who='',busy=false;
const uname=k=>(users.find(u=>u.key===k)||{}).name||k;
const late=t=>t.dueDate&&t.dueDate<today()&&t.status!=='Completed';

async function api(body){
  if(API_URL.startsWith('PASTE'))throw new Error('Set API_URL in index.html first');
  const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({...cred,...body})});
  const d=await r.json();if(d.error)throw new Error(d.error);return d}
function toast(m,e){const d=document.createElement('div');d.className='toast'+(e?' e':'');d.textContent=m;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}
function sync(d){if(d.me)me=d.me;if(d.users)users=d.users;if(d.tasks)tasks=d.tasks}

function loginView(msg){
  $('#app').innerHTML=`<div class="login"><h2>Team Task Workspace</h2><small style="color:var(--mut)">Private workspace for you and your manager</small>
  <div class="f"><label>Email</label><input id="le" type="email" autocomplete="username" value="${esc(cred?.email||'')}"></div>
  <div class="f"><label>PIN</label><input id="lp" type="password" autocomplete="current-password"></div>
  <div class="late" style="min-height:18px">${esc(msg||'')}</div>
  <button class="btn pri" id="lg" style="width:100%">Sign in</button></div>`;
  $('#lg').onclick=async()=>{cred={email:$('#le').value.trim(),pin:$('#lp').value};
    try{$('#lg').disabled=true;sync(await api({action:'login'}));localStorage.setItem('twCred',JSON.stringify(cred));main()}
    catch(e){loginView(e.message)}}}

function main(){
  const mine=tasks.filter(t=>t.assignee===me.key),open=tasks.filter(t=>t.status!=='Completed');
  const S=[['all','All tasks',tasks.length],['mine','Assigned to me',mine.filter(t=>t.status!=='Completed').length],['open','Open',open.length],['late','Overdue',tasks.filter(late).length]];
  let r=tasks.slice();
  if(flt==='mine')r=r.filter(t=>t.assignee===me.key);else if(flt==='open')r=r.filter(t=>t.status!=='Completed');else if(flt==='late')r=r.filter(late);
  if(who)r=r.filter(t=>t.assignee===who);
  if(q)r=r.filter(t=>JSON.stringify(t).toLowerCase().includes(q.toLowerCase()));
  r.sort((a,b)=>(a.status==='Completed')-(b.status==='Completed')||(a.dueDate||'9').localeCompare(b.dueDate||'9'));
  $('#app').innerHTML=`<div class="top"><div><h1>Task Workspace</h1><small>${esc(me.name)} · ${me.key==='manager'?'Manager':'Team member'}</small></div>
  <div><button class="btn" id="rf">Refresh</button> <button class="btn pri" id="nw">+ ${me.key==='manager'?'Assign task':'New task'}</button> <button class="btn" id="lo">Sign out</button></div></div>
  <div class="wrap"><div class="stats">${S.map(s=>`<button class="st ${flt===s[0]?'on':''} ${s[0]==='late'&&s[2]?'r':''}" data-f="${s[0]}"><small>${s[1]}</small><b>${s[2]}</b></button>`).join('')}</div>
  <div class="bar"><input id="q" placeholder="Search tasks…" value="${esc(q)}"><select id="wf"><option value="">Everyone</option>${users.map(u=>`<option value="${u.key}" ${who===u.key?'selected':''}>${esc(u.name)}</option>`).join('')}</select></div>
  <div class="list">${r.map(t=>`<div class="row" data-id="${t.id}"><div><b>${esc(t.title)}</b><br><small>${t.id} · Assigned to ${esc(uname(t.assignee))} by ${esc(uname(t.createdBy))} · Due <span class="${late(t)?'late':''}">${fd(t.dueDate)}</span></small></div>
  <div class="meta"><span class="tag ${PC[t.priority]}">${t.priority}</span><span class="tag ${SC[t.status]}">${t.status}</span></div><div class="bar2"><i style="width:${t.progress||0}%"></i></div></div>`).join('')||'<div class="empty">No tasks here yet.</div>'}</div></div>`;
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{flt=b.dataset.f;main()});
  document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>detail(b.dataset.id));
  $('#q').oninput=e=>{q=e.target.value;main();const i=$('#q');i.focus();i.setSelectionRange(99,99)};
  $('#wf').onchange=e=>{who=e.target.value;main()};
  $('#nw').onclick=()=>form();$('#rf').onclick=refresh;
  $('#lo').onclick=()=>{localStorage.removeItem('twCred');cred=null;loginView()}}

const close=()=>$('#ov').classList.remove('show');
$('#ov').onclick=e=>{if(e.target.id==='ov')close()};
const show=h=>{$('#ov').innerHTML='<div class="box">'+h+'</div>';$('#ov').classList.add('show')};

function form(id){
  const t=tasks.find(x=>x.id===id)||{assignee:me.key==='manager'?'employee':me.key,priority:'Medium',status:'Pending',progress:0,dueDate:''};
  const sel=(k,o,v)=>`<select id="f_${k}">${o.map(x=>`<option value="${x[0]}" ${x[0]===v?'selected':''}>${esc(x[1])}</option>`).join('')}</select>`;
  show(`<h3>${id?'Edit':'New'} task</h3><div class="grid">
  <div class="f full"><label>Title *</label><input id="f_title" value="${esc(t.title||'')}"></div>
  <div class="f full"><label>Description</label><textarea id="f_description">${esc(t.description||'')}</textarea></div>
  <div class="f"><label>Assigned to</label>${sel('assignee',users.map(u=>[u.key,u.name]),t.assignee)}</div>
  <div class="f"><label>Due date</label><input id="f_dueDate" type="date" value="${t.dueDate||''}"></div>
  <div class="f"><label>Priority</label>${sel('priority',PR.map(x=>[x,x]),t.priority)}</div>
  <div class="f"><label>Status</label>${sel('status',ST.map(x=>[x,x]),t.status)}</div>
  <div class="f full"><label>Progress: <span id="pv">${t.progress||0}</span>%</label><input id="f_progress" type="range" min="0" max="100" step="5" value="${t.progress||0}"></div>
  <div class="f full"><label>Comment (included in the email)</label><textarea id="f_comment" placeholder="Optional note for ${me.key==='manager'?'your team member':'your manager'}"></textarea></div></div>
  <div class="acts"><button class="btn" id="c1">Cancel</button><button class="btn pri" id="s1">Save &amp; notify</button></div>`);
  $('#f_progress').oninput=e=>$('#pv').textContent=e.target.value;
  $('#c1').onclick=close;
  $('#s1').onclick=async()=>{const v=k=>$('#f_'+k).value.trim();if(!v('title'))return toast('Title is required',1);
    const task={id:id||undefined,title:v('title'),description:v('description'),assignee:v('assignee'),dueDate:v('dueDate'),priority:v('priority'),status:v('status'),progress:+v('progress')};
    await save(task,v('comment'),$('#s1'))}}

async function save(task,comment,btn){
  try{if(btn)btn.disabled=true;const d=await api({action:'save',task,comment});sync(d);close();main();toast('Saved · email sent')}
  catch(e){toast(e.message,1);if(btn)btn.disabled=false}}

function detail(id){
  const t=tasks.find(x=>x.id===id);if(!t)return;
  const items=[...(t.comments||[]).map(c=>({...c,c:1})),...(t.log||[])].sort((a,b)=>a.at.localeCompare(b.at));
  show(`<div style="display:flex;justify-content:space-between;gap:10px"><div><h3>${esc(t.title)}</h3><small style="color:var(--mut)">${t.id} · created ${ft(t.createdAt)} by ${esc(uname(t.createdBy))}</small></div><button class="btn" id="dx">Close</button></div>
  <div class="meta" style="justify-content:flex-start;margin:10px 0"><span class="tag ${PC[t.priority]}">${t.priority}</span><span class="tag ${SC[t.status]}">${t.status}</span><span class="tag">${t.progress||0}%</span><span class="tag ${late(t)?'r':''}">Due ${fd(t.dueDate)}</span><span class="tag">${esc(uname(t.assignee))}</span></div>
  ${t.description?`<p>${esc(t.description).replace(/\n/g,'<br>')}</p>`:''}
  <h4>Activity</h4>${items.map(i=>i.c?`<div class="cm ${i.by==='manager'?'m':''}"><small>${esc(uname(i.by))} · ${ft(i.at)}</small>${esc(i.text).replace(/\n/g,'<br>')}</div>`:`<div class="log">${ft(i.at)} · ${esc(uname(i.by))} changed ${esc(i.text)}</div>`).join('')||'<div class="log">No activity yet.</div>'}
  <h4>Add update</h4><div class="grid" style="margin-top:4px"><div class="f"><label>Status</label><select id="d_st">${ST.map(x=>`<option ${x===t.status?'selected':''}>${x}</option>`).join('')}</select></div>
  <div class="f"><label>Progress: <span id="dpv">${t.progress||0}</span>%</label><input id="d_pr" type="range" min="0" max="100" step="5" value="${t.progress||0}"></div>
  <div class="f full"><textarea id="d_cm" placeholder="Write a comment or progress note…"></textarea></div></div>
  <div class="acts"><button class="btn" id="de">Edit details</button>${me.key==='manager'?'<button class="btn dg" id="dd">Delete</button>':''}<button class="btn pri" id="ds">Post update &amp; notify</button></div>`);
  $('#dx').onclick=close;$('#de').onclick=()=>form(id);$('#d_pr').oninput=e=>$('#dpv').textContent=e.target.value;
  $('#ds').onclick=()=>{const c=$('#d_cm').value.trim(),st=$('#d_st').value,pr=+$('#d_pr').value;
    if(!c&&st===t.status&&pr===(t.progress||0))return toast('Nothing to update',1);
    save({id,status:st,progress:pr},c,$('#ds'))};
  if($('#dd'))$('#dd').onclick=async()=>{if(!confirm('Delete this task?'))return;try{sync(await api({action:'delete',id}));close();main()}catch(e){toast(e.message,1)}}}

async function refresh(){if(busy||!me)return;busy=true;try{sync(await api({action:'list'}));if(!$('#ov').classList.contains('show')&&document.activeElement.id!=='q')main()}catch(e){}busy=false}

if(cred){api({action:'login'}).then(d=>{sync(d);main()}).catch(e=>loginView(e.message))}else loginView();
setInterval(refresh,30000);
})();
</script></body></html>
